<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block title %}Chatbot Dashboard{% endblock %}</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css"
        />
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        {% load static %}
        <link
            rel="stylesheet"
            href="{% static 'chatbot/css/dashboard.css' %}"
        />
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container">
                <a class="navbar-brand" href="{% url 'dashboard' %}">
                    <i class="bi bi-robot"></i> Chatbot Dashboard
                </a>
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="{% url 'dashboard' %}"
                        >Dashboard</a
                    >
                    <a class="nav-link" href="{% url 'admin:index' %}">Admin</a>
                    <a class="nav-link" href="{% url 'widget_demo' %}"
                        >Widget Demo</a
                    >
                </div>
            </div>
        </nav>

        <div class="container-fluid py-4">
            {% block content %} {% endblock %}
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
        {% load static %}
        <script src="{% static 'chatbot/js/dashboard.js' %}"></script>
        {% block extra_js %}{% endblock %}
    </body>
</html>
